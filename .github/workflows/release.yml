name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Installer EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore JustConvert.slnx

      - name: Publish CLI
        run: >
          dotnet publish src/JustConvert.Cli/JustConvert.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o dist/app

      - name: Publish Shell Extension DLL
        run: >
          dotnet publish src/JustConvert.ShellExtension/JustConvert.ShellExtension.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o dist/app

      - name: Copy Assets and Manifests
        shell: pwsh
        run: |
          Copy-Item -Path "manifests/AppxManifest.xml" -Destination "dist/app/" -Force
          Copy-Item -Path "README.md" -Destination "dist/app/" -Force

      - name: Publish Standalone Installer (JustConvert-Setup.exe)
        run: >
          dotnet publish src/JustConvert.Installer/JustConvert.Installer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/installer

      - name: Bundle Payload with Installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { "0.0.1" }
          
          # Copy app files into installer distribution folder
          Copy-Item -Path "dist/app/*" -Destination "dist/installer/" -Force -Recurse
          
          $installerExe = "JustConvert-$version-Setup.exe"
          Copy-Item -Path "dist/installer/JustConvert-Setup.exe" -Destination $installerExe -Force
          
          # Generate Checksum
          $hash = (Get-FileHash -Path $installerExe -Algorithm SHA256).Hash
          "$hash  $installerExe" | Out-File -FilePath "$installerExe.sha256" -Encoding ascii

          echo "INSTALLER_EXE=$installerExe" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.INSTALLER_EXE }}
            ${{ env.INSTALLER_EXE }}.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

  winget:
    name: Publish to Windows Package Manager (WinGet)
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Submit to WinGet Repository
        uses: vedantmgoyal2009/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: m1sh3r.JustConvert
          version: ${{ github.ref_name }}
          installer-type: exe
          installer-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/JustConvert-${{ github.ref_name }}-Setup.exe
          token: ${{ secrets.WINGET_TOKEN }}

