name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Installer EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore JustConvert.slnx

      - name: Publish CLI
        run: >
          dotnet publish src/JustConvert.Cli/JustConvert.Cli.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o dist/app

      - name: Publish Standalone Installer
        run: >
          dotnet publish src/JustConvert.Installer/JustConvert.Installer.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PayloadDir=${{ github.workspace }}/dist/app
          -o dist/installer

      - name: Bundle Payload with Installer
        shell: pwsh
        run: |
          $installerFile = Get-ChildItem -Path "dist/installer/JustConvert-*-Setup.exe" | Select-Object -First 1
          $installerExe = $installerFile.Name
          Move-Item -Path $installerFile.FullName -Destination "." -Force

          # Generate Checksum
          $hash = (Get-FileHash -Path $installerExe -Algorithm SHA256).Hash
          "$hash  $installerExe" | Out-File -FilePath "$installerExe.sha256" -Encoding ascii

          echo "INSTALLER_EXE=$installerExe" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.INSTALLER_EXE }}
            ${{ env.INSTALLER_EXE }}.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
